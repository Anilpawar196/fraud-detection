name: CI

# push -> lint -> unit tests -> docker build -> API smoke test
#
# The dataset is not available in CI (1.3 GB, Kaggle competition rules), so the
# test suite runs entirely on schema-faithful synthetic fixtures — see
# tests/conftest.py. That is a deliberate constraint: the tests exercise real
# code paths, including training a small LightGBM model and scoring it through
# the API, without needing the data.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        # Version is read from requirements-dev.txt so local and CI can never
        # drift. A hardcoded pin here previously disagreed with the locally
        # installed version and failed the build on formatting differences.
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: Ruff check
        run: ruff check src api scripts tests

      - name: Ruff format check
        run: ruff format --check src api scripts tests

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        # libgomp1 is required by LightGBM's OpenMP threading.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q --cov=src --cov=api --cov-report=term-missing

  docker:
    name: Docker build + API smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fraud-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name fraud-api-ci -p 8000:8000 fraud-api:ci
          sleep 3
          echo "--- container state immediately after start ---"
          docker ps -a --filter name=fraud-api-ci --format '{{.Names}} {{.Status}}'
          # If uvicorn died on import the container is already gone; surface that
          # here rather than after a 60s readiness timeout.
          running=$(docker inspect -f '{{.State.Running}}' fraud-api-ci)
          if [ "$running" != "true" ]; then
            echo "Container is not running. Exit code and logs follow."
            docker inspect -f '{{.State.ExitCode}}' fraud-api-ci
            docker logs fraud-api-ci
            exit 1
          fi

      - name: Wait for the service to respond
        run: |
          # Startup imports shap, scikit-learn and pandas, which is slow on a
          # cold container, so allow 120s before declaring failure.
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "Service responded after $((attempt * 2))s"
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' fraud-api-ci | grep -q true; then
              echo "Container died while starting up:"
              docker logs fraud-api-ci
              exit 1
            fi
            sleep 2
          done
          echo "Service did not become ready within 120s"
          docker logs fraud-api-ci
          exit 1

      - name: Smoke test endpoints
        run: |
          set -uo pipefail
          fail=0
          check() {  # check <label> <actual> <expected>
            if [ "$2" = "$3" ]; then
              echo "  PASS  $1 -> $2"
            else
              echo "  FAIL  $1 -> $2 (expected $3)"; fail=1
            fi
          }

          echo "=== GET /health ==="
          health=$(curl -sS http://localhost:8000/health)
          echo "$health"
          case "$health" in
            *'"status":"degraded"'*) echo "  PASS  status is degraded" ;;
            *) echo "  FAIL  status is not degraded"; fail=1 ;;
          esac
          case "$health" in
            *'"model_loaded":false'*) echo "  PASS  model_loaded is false" ;;
            *) echo "  FAIL  model_loaded is not false"; fail=1 ;;
          esac

          echo "=== GET /docs ==="
          check "/docs" "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/docs)" "200"

          echo "=== OpenAPI routes ==="
          spec=$(curl -sS http://localhost:8000/openapi.json)
          for route in "/health" "/predict" "/explain"; do
            case "$spec" in
              *"\"$route\""*) echo "  PASS  $route registered" ;;
              *) echo "  FAIL  $route missing from spec"; fail=1 ;;
            esac
          done

          echo "=== POST /predict without a model ==="
          # /predict declares Depends(require_artifact); FastAPI resolves
          # dependencies before validating the body, so with no model mounted
          # every call is 503 regardless of payload. The 422 validation path is
          # covered by tests/test_api.py, which runs with a model loaded.
          check "valid body" "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/predict -H 'Content-Type: application/json' -d '{"transaction_amt": 100.0, "product_cd": "W"}')" "503"
          check "invalid body" "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/predict -H 'Content-Type: application/json' -d '{"transaction_amt": -5.0}')" "503"

          echo "=== POST /explain without a model ==="
          check "/explain" "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/explain -H 'Content-Type: application/json' -d '{"transaction_amt": 100.0, "product_cd": "W"}')" "503"

          if [ "$fail" -ne 0 ]; then
            echo "Smoke tests failed; container logs follow."
            docker logs fraud-api-ci
            exit 1
          fi
          echo "All smoke tests passed"

      - name: Container logs
        if: always()
        run: docker logs fraud-api-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f fraud-api-ci || true
