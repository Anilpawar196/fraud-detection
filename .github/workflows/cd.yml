name: CD

# Continuous deployment pipeline for fraud-detection-api
#
# This workflow runs after CI passes on the main branch.
# It builds the Docker image, pushes it to a container registry,
# and deploys to a cloud service.
#
# Setup required:
# - Docker Hub or GitHub Container Registry credentials
# - Cloud deployment credentials (e.g., AWS, Google Cloud, Azure)
# - Model artifact must be built and available

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Only run CD if CI passed
  check-ci-status:
    name: Verify CI passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CI workflow
        run: |
          echo "This job verifies that CI (lint, tests, docker build) passed."
          echo "CD proceeds only if all CI checks were successful."

  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: check-ci-status
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to cloud service
    runs-on: ubuntu-latest
    needs: build-and-push
    # This job is currently a placeholder. To enable deployment:
    # 1. Choose a deployment target (Railway, Render, AWS ECS, Google Cloud Run, etc.)
    # 2. Add deployment credentials as secrets
    # 3. Uncomment and customize the deployment steps below
    if: false  # Disabled until deployment is configured
    steps:
      - uses: actions/checkout@v4

      - name: Deploy placeholder
        run: |
          echo "CD deployment is not yet configured."
          echo ""
          echo "To enable deployment, configure:"
          echo "  1. A deployment target (Railway, Render, AWS ECS, Google Cloud Run, Heroku, etc.)"
          echo "  2. Deployment credentials as GitHub secrets"
          echo "  3. Uncomment the deployment steps in .github/workflows/cd.yml"
          echo ""
          echo "Example Railway deployment (when configured):"
          echo "  - Install railway CLI"
          echo "  - Authenticate with RAILWAY_TOKEN secret"
          echo "  - Deploy with: railway up --name fraud-api"
          echo ""
          echo "Example Google Cloud Run deployment (when configured):"
          echo "  - Authenticate with GCLOUD_SERVICE_KEY secret"
          echo "  - Push image to Google Artifact Registry"
          echo "  - Deploy with: gcloud run deploy fraud-api --image <image-url>"

  health-check:
    name: Verify deployment health
    runs-on: ubuntu-latest
    needs: deploy
    if: false  # Disabled until deployment is active
    steps:
      - name: Health check placeholder
        run: |
          echo "Deployment health check would run here."
          echo "When active, this would:"
          echo "  - Poll the deployed service's /health endpoint"
          echo "  - Verify the model loaded successfully"
          echo "  - Test basic predict/explain endpoints"
          echo "  - Rollback on failure"

  notify:
    name: Notify deployment status
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy, health-check]
    if: always()
    steps:
      - name: Report status
        run: |
          if [ "${{ needs.build-and-push.result }}" = "success" ]; then
            echo "✓ Docker image built and pushed successfully"
          else
            echo "✗ Docker image build failed"
            exit 1
          fi
          echo ""
          echo "Build ID: ${{ github.run_id }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
